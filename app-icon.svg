<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7c35a"/><stop offset="1" stop-color="#e9a020"/></linearGradient></defs>
<rect x="0" y="0" width="1024" height="1024" rx="230.4" fill="url(#g)"/><rect x="0.5" y="0.5" width="1023" height="1023" rx="229.9" fill="none" stroke="#000000" stroke-opacity="0.10"/>
