<!-- Switchyard app icon: a lane change between two tracks, in ink on an amber tile.
     src-tauri/icons was made from this at 1024 px with `npx tauri icon` (desktop files
     only); icon.icns from a copy with a 100 px margin (macOS's icon grid); icon.ico and
     32x32.png from per-size drawings: the lane change alone at 16 px, heavier strokes
     up to 48 px. -->
