[package]
# The binary keeps its original name: the Windows installer recognises a running copy
# by it when updating. (The app's name, Switchyard, is tauri.conf.json's productName.)
name = "claude-desk"
version = "0.2.3"
description = "Switchyard: a workspace for running Claude Code sessions side by side"
edition = "2021"

[lib]
name = "claude_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-notification = "2"
arboard = "3"
png = "0.17"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
