# Checks every pull request (and main) before it can ship:
#
#   rust   the backend's tests and clippy on Linux, Windows and macOS, so platform-only
#          code (e.g. how Claude is started and stopped on Windows) is compiled and tested
#   ui     type check, production build, and the UI robustness suite (tests/ui.mjs):
#          the real app in headless Chromium against a scripted backend
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The web view's libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the built frontend, so build it first.
      - run: npm ci
      - run: npm run build
      - name: Tests
        working-directory: src-tauri
        run: cargo test --release
      - name: Clippy
        working-directory: src-tauri
        # Warnings fail the build on Linux (known clean); elsewhere they're reported.
        run: cargo clippy --release --all-targets ${{ runner.os == 'Linux' && '-- -D warnings' || '' }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
